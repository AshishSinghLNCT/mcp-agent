server:
  port: 8081

spring:
  application:
    name: mcp-tools-server

  ai:
    mcp:
      server:
        name: job-agent-tools-server
        version: 1.0.0
        # SYNC keeps tool calls simple and blocking, which is fine for these three tools.
        type: SYNC

  datasource:
    url: jdbc:h2:mem:projectsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    # let Hibernate create the schema before data.sql inserts sample rows
    defer-datasource-initialization: true
    show-sql: false

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

# Optional: set GITHUB_TOKEN in your shell to avoid the 60 req/hour unauthenticated rate limit.
github:
  token: ${GITHUB_TOKEN:}

logging:
  level:
    com.ashishsingh.mcptools: INFO
