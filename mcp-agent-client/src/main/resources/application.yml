server:
  port: 8080

spring:
  application:
    name: mcp-agent-client

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.1
        options:
          temperature: 0.2

    mcp:
      client:
        name: job-agent-client
        version: 1.0.0
        request-timeout: 30s
        # SYNC: block until the tools-server responds. Fine for this demo's scale.
        type: SYNC
        toolcallback:
          enabled: true
        sse:
          connections:
            tools-server:
              url: http://localhost:8081

logging:
  level:
    com.ashishsingh.mcpagent: INFO
